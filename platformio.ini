; LED Grid: a 16x16 WS2812B panel driven by a classic ESP32 DevKit (CP2102,
; USB-C), controlled from a phone over Wi-Fi.
;
;   pio run -t upload        build and flash
;   pio device monitor       serial log (shows the IP addresses)

[platformio]
default_envs = esp32dev
; ota.ini holds the wireless-update password (gitignored, made by hand once:
;   [ota]
;   password = <random>
extra_configs = ota.ini

[env:esp32dev]
platform = espressif32 @ ~6.9.0      ; Arduino core 2.0.x
board = esp32dev
framework = arduino

; Only match the CP2102 bridge. Auto-detect otherwise grabs Bluetooth
; headphones (cu.BeatsStudio etc.) and the upload times out.
upload_port = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=1
    '-D OTA_PASSWORD="${ota.password}"'

lib_deps =
    fastled/FastLED @ 3.7.8
    bblanchon/ArduinoJson @ 7.2.1
    knolleary/PubSubClient @ 2.8
build_src_filter = +<*> -<diag/>
extra_scripts = pre:tools/gzip_webpage.py

; Wiring diagnostic: pio run -e diag -t upload (see src/diag/diag.cpp)
[env:diag]
extends = env:esp32dev
build_src_filter = +<diag/>

; Flash over Wi-Fi: pio run -e ota -t upload
; (the board's address on the home network; ledgrid.local didn't resolve here)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.240
upload_flags =
    --auth=${ota.password}
    --timeout=30

; Two 16x16 panels chained into one 32x16 screen (panel 1 DOUT -> panel 2 DIN,
; one data wire on GPIO 13). USB: pio run -e wide -t upload
; The CH340 board shows up as cu.wchusbserial*, not cu.usbserial-*.
[env:wide]
extends = env:esp32dev
upload_port = /dev/cu.wchusbserial*
monitor_port = /dev/cu.wchusbserial*
build_flags =
    ${env:esp32dev.build_flags}
    -D GRID_W=32

; Wide grid over Wi-Fi: pio run -e wide-ota -t upload --upload-port <its IP>
[env:wide-ota]
extends = env:wide
upload_protocol = espota
upload_port = 0.0.0.0
upload_flags =
    --auth=${ota.password}
    --timeout=30
